name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch. Pushing again cancels the run the previous push started,
# which is almost always what is wanted: the older run is testing code that has
# already been replaced, and its result would be reported against a commit
# nobody is looking at any more.
#
# Written after a session of fixing CI ran up thousands of billable minutes --
# eight pushes in a row, each starting a fresh run while the previous ones kept
# going, three of them alive at once at the worst point.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-and-release:
    # A ceiling, not an estimate: GitHub's default is 360 minutes, and a step
    # that hangs rather than fails burns every one of them. This job runs in
    # about 20, so 60 leaves room for a slow runner while cutting a hang short.
    # See the Windows workflow for the hang that prompted this.
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and preview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libarchive-dev libssh2-1-dev libsecret-1-dev libcurl4-openssl-dev libssl-dev libsmbclient-dev libmpv-dev libpoppler-qt5-dev libqt5x11extras5-dev libqt5websockets5-dev qtbase5-dev qttools5-dev-tools libgtest-dev zlib1g-dev libxcb1-dev ffmpeg p7zip-full squashfs-tools gvfs
      - name: Prepare XDG trash for file-operation tests
        run: |
          export XDG_DATA_HOME="$GITHUB_WORKSPACE/build/xdg-data"
          export TMPDIR="$GITHUB_WORKSPACE/build/tmp"
          mkdir -p "$XDG_DATA_HOME/Trash/files" "$XDG_DATA_HOME/Trash/info" "$TMPDIR"
          chmod 700 "$XDG_DATA_HOME/Trash" "$XDG_DATA_HOME/Trash/files" "$XDG_DATA_HOME/Trash/info" "$TMPDIR"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
      - name: Debug regression
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug --parallel
          ctest --test-dir build/linux-debug --output-on-failure -E '^ui_tests$'
          ui_tests=build/linux-debug/tests/ui/ui_tests
          suites=$("$ui_tests" --gtest_list_tests | awk '/^[^[:space:]].*\.$/ { sub(/\.$/, ""); print }')
          while IFS= read -r suite; do
            test -z "$suite" || "$ui_tests" --gtest_color=no --gtest_filter="${suite}.*"
          done <<< "$suites"
      - name: Account server regression and static analysis
        run: |
          cargo test --release --manifest-path server/Cargo.toml
          cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: Account server dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: server
      # office-oxide renders docx/pptx/xlsx for the preview pane. It lives in a
      # separate repository, and build-deb.sh / build-appimage.sh look for it on
      # PATH exactly the way the application does at runtime -- so putting it
      # there is all that is needed. Without OFFICE_OXIDE_REPO set on this
      # repository the packages are still produced, silently without Office
      # preview, which is what those scripts already do on a machine that lacks
      # it. The warning is so that cannot be mistaken for a complete package.
      # Cloned before the cache is consulted so the key can name the exact commit
      # that was fetched: cloning is seconds, compiling is minutes, and a branch
      # name would go stale silently the moment the branch moved.
      - name: Fetch office-oxide source
        id: oxide-src
        if: vars.OFFICE_OXIDE_REPO != ''
        env:
          OFFICE_OXIDE_REPO: ${{ vars.OFFICE_OXIDE_REPO }}
          OFFICE_OXIDE_REF: ${{ vars.OFFICE_OXIDE_REF }}
        run: |
          git clone --depth 1 ${OFFICE_OXIDE_REF:+--branch "$OFFICE_OXIDE_REF"} "$OFFICE_OXIDE_REPO" build/office-oxide-src
          echo "sha=$(git -C build/office-oxide-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Warn when office-oxide is not configured
        if: vars.OFFICE_OXIDE_REPO == ''
        run: |
          echo "::warning::OFFICE_OXIDE_REPO is not set: these packages will have no Office document preview."

      # Only the binary is cached, not Cargo's target directory: the source is
      # pinned by commit, so a hit means the same binary would have come out.
      - name: Restore office-oxide
        id: oxide-cache
        if: vars.OFFICE_OXIDE_REPO != ''
        uses: actions/cache/restore@v4
        with:
          path: build/office-oxide
          key: office-oxide-x64-linux-${{ steps.oxide-src.outputs.sha }}

      # -p office_oxide_cli, not the whole workspace: its other member is an MCP
      # server this application never invokes.
      - name: Build office-oxide
        id: oxide-build
        if: vars.OFFICE_OXIDE_REPO != '' && steps.oxide-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --release --manifest-path build/office-oxide-src/Cargo.toml -p office_oxide_cli
          mkdir -p build/office-oxide
          cp build/office-oxide-src/target/release/office-oxide build/office-oxide/

      - name: Save office-oxide
        if: steps.oxide-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/office-oxide
          key: ${{ steps.oxide-cache.outputs.cache-primary-key }}

      # On PATH, which is exactly where the packaging scripts and the running
      # application both look for it.
      - name: Put office-oxide on PATH
        if: vars.OFFICE_OXIDE_REPO != ''
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 0755 build/office-oxide/office-oxide "$HOME/.local/bin/office-oxide"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Release regression and Debian package
        run: |
          cmake -S . -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DTTC_BUILD_TESTS=ON -DTTC_BUILD_BENCH=OFF
          cmake --build build/linux-release --parallel
          ctest --test-dir build/linux-release --output-on-failure
          ./packaging/build-deb.sh
      - name: Validate source boundaries
        run: |
          git diff --check
          ! rg -n '#include <(windows|winsock)' src/platform src/core --glob '*.h'
      - uses: actions/upload-artifact@v4
        with:
          name: FileCommander-linux-deb
          path: dist/*.deb

      # A separate job would have to build the whole tree again; the AppImage
      # bundles the same Release binary the .deb was just cut from, so it rides
      # along here. build-appimage.sh fetches linuxdeploy itself and falls back
      # to --appimage-extract-and-run when /dev/fuse is absent, which is the
      # case on a GitHub runner.
      - name: AppImage
        run: ./packaging/build-appimage.sh

      # Proof it is a real type-2 AppImage and not a self-extracting archive:
      # the runtime is what sets $APPIMAGE, and UpdateChecker reads that to
      # decide which update channel this build belongs to. A bare archive would
      # leave it unset and send the updater down the .deb path.
      #
      # Checked by the magic bytes rather than by running it. The application
      # takes no --version flag, so running it would open a window and hang a
      # headless runner; the type-2 marker (the bytes "AI" then 0x02, at offset 8 of the ELF)
      # is the property that actually matters here and it is exact.
      - name: Check the AppImage carries a type-2 runtime
        run: |
          image=$(ls dist/FileCommander-*-x86_64.AppImage)
          magic=$(dd if="$image" bs=1 skip=8 count=3 status=none | xxd -p)
          echo "$image magic=$magic"
          test "$magic" = "414902"
          test -x "$image"

      - uses: actions/upload-artifact@v4
        with:
          name: FileCommander-linux-appimage
          path: dist/*.AppImage
