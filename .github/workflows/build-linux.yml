name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and preview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libarchive-dev libssh2-1-dev libsecret-1-dev libcurl4-openssl-dev libsmbclient-dev libmpv-dev libpoppler-qt5-dev libqt5x11extras5-dev qtbase5-dev qttools5-dev-tools libgtest-dev zlib1g-dev libxcb1-dev ffmpeg p7zip-full squashfs-tools
      - name: Debug regression
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug --parallel
          ctest --preset linux-debug
      - name: Release regression and Debian package
        run: |
          cmake -S . -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DTTC_BUILD_TESTS=ON -DTTC_BUILD_BENCH=OFF
          cmake --build build/linux-release --parallel
          ctest --test-dir build/linux-release --output-on-failure
          ./packaging/build-deb.sh
      - name: Validate source boundaries
        run: |
          git diff --check
          ! rg -n '#include <(windows|winsock)' src/platform src/core --glob '*.h'
      - uses: actions/upload-artifact@v4
        with:
          name: FileCommander-linux-deb
          path: dist/*.deb
