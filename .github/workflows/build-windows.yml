name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_preview:
        description: Run the self-hosted full-preview and package job
        required: false
        type: boolean
        default: false

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
      - name: Install test and provider dependencies
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows libarchive libssh2 curl gtest zlib
      - name: Configure and build
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ steps.qt.outputs.dir }}
        run: |
          cmake --preset windows-msvc-debug
          cmake --build --preset windows-msvc-debug --parallel
      - name: Run contract and UI suites
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ steps.qt.outputs.dir }}
        run: ctest --preset windows-msvc-debug
      - name: Validate source boundaries
        shell: pwsh
        run: |
          git diff --check
          if (rg -n '#include <(windows|winsock|sys/|xcb|QDBus)' src\platform\*.h src\core\*.h) { exit 1 }

  # The portable zip, built where anyone can build it.
  #
  # It is the FULL package: PDF preview included, because poppler-qt5 is built
  # here from source. There is no packaged one for Windows -- vcpkg's poppler
  # does carry a `qt` feature, but it pulls qtbase, which in vcpkg is Qt 6, so
  # it produces poppler-qt6 and links against a Qt this project does not use.
  #
  # Building it takes minutes, so it is cached. The Qt5 bindings are in
  # upstream maintenance and barely move, so the key below stays warm for
  # months; only a version bump here or a Qt bump reburns it.
  package:
    runs-on: windows-latest
    env:
      POPPLER_VERSION: 26.04.0
      QT_VERSION: 5.15.2
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64

      - name: Cache poppler-qt5
        id: poppler-cache
        uses: actions/cache@v4
        with:
          path: build/poppler-qt5
          key: poppler-qt5-${{ env.POPPLER_VERSION }}-qt${{ env.QT_VERSION }}-x64-windows-${{ hashFiles('packaging/build-poppler-qt5.ps1') }}

      - name: Install provider dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows libarchive libssh2 curl zlib

      - name: Build poppler-qt5
        if: steps.poppler-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ steps.qt.outputs.dir }}
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
        run: ./packaging/build-poppler-qt5.ps1 -Version $env:POPPLER_VERSION

      # office-oxide renders docx/pptx/xlsx for the preview pane. It lives in a
      # separate repository, so CI can only bundle it when told where to get it:
      # set the OFFICE_OXIDE_REPO variable (and OFFICE_OXIDE_REF to pin it) on
      # this repository. Without it the package is built anyway and Office
      # preview silently does nothing -- which is exactly what the packaging
      # scripts already do on a machine that lacks it, so the behaviour is not
      # new. The warning below is here so a package missing it cannot be
      # mistaken for a complete one.
      - name: Build office-oxide
        shell: pwsh
        env:
          OFFICE_OXIDE_REPO: ${{ vars.OFFICE_OXIDE_REPO }}
          OFFICE_OXIDE_REF: ${{ vars.OFFICE_OXIDE_REF }}
        run: |
          if (-not $env:OFFICE_OXIDE_REPO) {
              Write-Warning 'OFFICE_OXIDE_REPO is not set: this package will have no Office document preview.'
              exit 0
          }
          git clone --depth 1 $(if ($env:OFFICE_OXIDE_REF) { "--branch=$env:OFFICE_OXIDE_REF" }) $env:OFFICE_OXIDE_REPO build/office-oxide-src
          cargo build --release --manifest-path build/office-oxide-src/Cargo.toml
          New-Item -ItemType Directory -Force -Path build/office-oxide | Out-Null
          Copy-Item build/office-oxide-src/target/release/office-oxide.exe build/office-oxide/

      - name: Build the portable package
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ steps.qt.outputs.dir }}
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
          FILECOMMANDER_POPPLER_QT5_ROOT: ${{ github.workspace }}/build/poppler-qt5
        run: ./packaging/build-windows.ps1 -Profile windows-portable

      - uses: actions/upload-artifact@v4
        with:
          name: FileCommander-windows-x64-zip
          path: dist/FileCommander-*-windows-x64.zip

  full-preview-package:
    if: github.event_name == 'workflow_dispatch' && inputs.full_preview
    runs-on: [self-hosted, windows, filecommander-full-preview]
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and smoke-test the full portable package
        shell: pwsh
        run: |
          cmake -S . -B build/windows-full-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:FILECOMMANDER_QT_ROOT" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DTTC_BUILD_TESTS=ON -DTTC_BUILD_BENCH=OFF -DFILECOMMANDER_ENABLE_NETWORK=ON -DFILECOMMANDER_PREVIEW_PDF=ON -DFILECOMMANDER_PREVIEW_MEDIA=ON -DFILECOMMANDER_POPPLER_QT5_ROOT="$env:FILECOMMANDER_POPPLER_QT5_ROOT" -DFILECOMMANDER_MPV_ROOT="$env:FILECOMMANDER_MPV_ROOT"
          cmake --build build/windows-full-ci --parallel
          ctest --test-dir build/windows-full-ci --output-on-failure
          ./packaging/build-windows.ps1 -WithFullPreviews
      - uses: actions/upload-artifact@v4
        with:
          name: FileCommander-windows-x64
          path: dist/FileCommander-*-windows-x64.zip
