name: Windows

# Not on every push, unlike the Linux workflow. A Windows runner minute is
# billed at TWICE a Linux one, and this workflow's two jobs take about 35 and 30
# minutes, so a single push to any branch costs roughly 130 billable minutes
# against a monthly allowance of 2,000 (Free) or 3,000 (Pro). Measured over this
# repository's history: Windows accounted for 3,586 of 3,958 billable minutes,
# or 91%, and eventually exhausted the account.
#
# Pull requests and tags still get the full check, and workflow_dispatch runs it
# on demand from the Actions tab -- which is the replacement for push, for the
# case of working directly on a branch and wanting Windows verified.
on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      full_preview:
        description: Run the self-hosted full-preview and package job
        required: false
        type: boolean
        default: false

# See the Linux workflow for why. Doubly worth it here at two-times billing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # windows-2022, not windows-latest. The newer image ships Visual Studio 18,
    # whose STL has dropped stdext::make_checked_array_iterator -- and Qt
    # 5.15.2's qlist.h still calls it, so every translation unit that includes
    # QList fails with "'stdext': is not a class or namespace name". Nothing in
    # this repository can fix that; the fix is a toolset the Qt build was made
    # for. The Qt package itself is msvc2019_64, so 2022 is already the newer
    # side of that pairing.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
      # msvc-dev-cmd sets VCPKG_ROOT to the vcpkg bundled inside Visual Studio.
      # That copy has no ports tree and none of the packages installed below --
      # they go to the runner image's own vcpkg -- so CMake resolved its
      # toolchain against one installation and every find_package against the
      # other, and the build died on "Could NOT find LibArchive" with the
      # packages sitting installed a directory away. Pinned here, AFTER that
      # action has run, so every later step agrees with the step that installs.
      - name: Point vcpkg at the runner's own installation
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install test and provider dependencies
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows libarchive libssh2 curl gtest zlib
      - name: Configure and build
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: |
          cmake --preset windows-msvc-debug
          cmake --build --preset windows-msvc-debug --parallel
      - name: Run contract and UI suites
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: ctest --preset windows-msvc-debug
      # Public headers in src/platform and src/core must not pull in a
      # platform's own headers; anything that needs them includes them in a .cpp.
      #
      # Rewritten twice over, for two faults that cancelled each other out into
      # a step that passed without checking much:
      #
      #   * it called ripgrep, which the windows-latest image happened to carry
      #     and windows-2022 does not, so the step died with "The term 'rg' is
      #     not recognized" as soon as the runner was pinned;
      #   * it globbed src\core\*.h, and src/core has no headers at its top
      #     level -- they are all in subdirectories. rg reported the missing
      #     path on stderr, which `if (...)` does not capture, so the whole
      #     thing read as "nothing found" and passed.
      #
      # Select-String is built into PowerShell, so there is nothing to install,
      # and the search is recursive like the Linux job's.
      - name: Validate source boundaries
        shell: pwsh
        run: |
          git diff --check
          $headers = Get-ChildItem -Path src\platform, src\core -Filter *.h -Recurse -File
          $leaks = $headers | Select-String -Pattern '#include <(windows|winsock|sys/|xcb|QDBus)'
          if ($leaks) {
              foreach ($leak in $leaks) {
                  Write-Host "::error file=$($leak.Path),line=$($leak.LineNumber)::platform header in a public header: $($leak.Line.Trim())"
              }
              exit 1
          }
          Write-Host "$($headers.Count) headers checked, none reaches for a platform header."

  # The portable zip, built where anyone can build it.
  #
  # It is the FULL package: PDF preview included, because poppler-qt5 is built
  # here from source. There is no packaged one for Windows -- vcpkg's poppler
  # does carry a `qt` feature, but it pulls qtbase, which in vcpkg is Qt 6, so
  # it produces poppler-qt6 and links against a Qt this project does not use.
  #
  # Building it takes minutes, so it is cached. The Qt5 bindings are in
  # upstream maintenance and barely move, so the key below stays warm for
  # months; only a version bump here or a Qt bump reburns it.
  package:
    # windows-2022, not windows-latest. The newer image ships Visual Studio 18,
    # whose STL has dropped stdext::make_checked_array_iterator -- and Qt
    # 5.15.2's qlist.h still calls it, so every translation unit that includes
    # QList fails with "'stdext': is not a class or namespace name". Nothing in
    # this repository can fix that; the fix is a toolset the Qt build was made
    # for. The Qt package itself is msvc2019_64, so 2022 is already the newer
    # side of that pairing.
    runs-on: windows-2022
    env:
      POPPLER_VERSION: 26.04.0
      QT_VERSION: 5.15.2
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64

      # msvc-dev-cmd sets VCPKG_ROOT to the vcpkg bundled inside Visual Studio.
      # That copy has no ports tree and none of the packages installed below --
      # they go to the runner image's own vcpkg -- so CMake resolved its
      # toolchain against one installation and every find_package against the
      # other, and the build died on "Could NOT find LibArchive" with the
      # packages sitting installed a directory away. Pinned here, AFTER that
      # action has run, so every later step agrees with the step that installs.
      - name: Point vcpkg at the runner's own installation
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Restore and save are separate steps on purpose.
      #
      # actions/cache writes its cache in a post-job step that only runs when
      # the JOB succeeded. This job kept failing after poppler was already
      # built -- on office-oxide, on packaging, on whatever was broken that
      # round -- so the cache was never written even once, and the ~25 minute
      # build was repeated from scratch every run. Measured: the repository had
      # ZERO caches stored, and 1,636 billable minutes had gone into rebuilding
      # the same library.
      #
      # Splitting them lets the save happen the moment poppler exists, which is
      # the point at which the expensive work is worth keeping regardless of
      # what the rest of the job does.
      - name: Restore poppler-qt5
        id: poppler-cache
        uses: actions/cache/restore@v4
        with:
          path: build/poppler-qt5
          key: poppler-qt5-${{ env.POPPLER_VERSION }}-qt${{ env.QT_VERSION }}-x64-windows-${{ hashFiles('packaging/build-poppler-qt5.ps1') }}

      - name: Install provider dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows libarchive libssh2 curl zlib

      - name: Build poppler-qt5
        id: poppler-build
        if: steps.poppler-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: ./packaging/build-poppler-qt5.ps1 -Version $env:POPPLER_VERSION

      # Skipped on a cache hit, because the build step above was skipped and its
      # outcome is then 'skipped' rather than 'success'.
      - name: Save poppler-qt5
        if: steps.poppler-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/poppler-qt5
          key: ${{ steps.poppler-cache.outputs.cache-primary-key }}

      # office-oxide renders docx/pptx/xlsx for the preview pane. It lives in a
      # separate repository, so CI can only bundle it when told where to get it:
      # set the OFFICE_OXIDE_REPO variable (and OFFICE_OXIDE_REF to pin it) on
      # this repository. Without it the package is built anyway and Office
      # preview silently does nothing -- which is exactly what the packaging
      # scripts already do on a machine that lacks it, so the behaviour is not
      # new. The warning below is here so a package missing it cannot be
      # mistaken for a complete one.
      # Cloned before the cache is consulted so the key can name the exact commit
      # that was fetched. Cloning is seconds; compiling is minutes, and a branch
      # name would go stale silently the moment the branch moved.
      - name: Fetch office-oxide source
        id: oxide-src
        if: vars.OFFICE_OXIDE_REPO != ''
        shell: pwsh
        env:
          OFFICE_OXIDE_REPO: ${{ vars.OFFICE_OXIDE_REPO }}
          OFFICE_OXIDE_REF: ${{ vars.OFFICE_OXIDE_REF }}
        run: |
          git clone --depth 1 $(if ($env:OFFICE_OXIDE_REF) { "--branch=$env:OFFICE_OXIDE_REF" }) $env:OFFICE_OXIDE_REPO build/office-oxide-src
          "sha=$(git -C build/office-oxide-src rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Warn when office-oxide is not configured
        if: vars.OFFICE_OXIDE_REPO == ''
        shell: pwsh
        run: |
          Write-Warning 'OFFICE_OXIDE_REPO is not set: this package will have no Office document preview.'

      # Only the 3 MB binary is cached, not Cargo's target directory: the source
      # is pinned by commit, so a hit means the exact same binary would have come
      # out, and hundreds of megabytes of intermediates buy nothing.
      - name: Restore office-oxide
        id: oxide-cache
        if: vars.OFFICE_OXIDE_REPO != ''
        uses: actions/cache/restore@v4
        with:
          path: build/office-oxide
          key: office-oxide-x64-windows-${{ steps.oxide-src.outputs.sha }}

      # -p office_oxide_cli, not the whole workspace: the repository is a Cargo
      # workspace whose other member is an MCP server this application never
      # invokes, and building it is minutes of Windows runner time -- billed at
      # twice the Linux rate -- for an artefact that is then discarded.
      - name: Build office-oxide
        id: oxide-build
        if: vars.OFFICE_OXIDE_REPO != '' && steps.oxide-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo build --release --manifest-path build/office-oxide-src/Cargo.toml -p office_oxide_cli
          New-Item -ItemType Directory -Force -Path build/office-oxide | Out-Null
          Copy-Item build/office-oxide-src/target/release/office-oxide.exe build/office-oxide/

      - name: Save office-oxide
        if: steps.oxide-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/office-oxide
          key: ${{ steps.oxide-cache.outputs.cache-primary-key }}

      - name: Build the portable package
        shell: pwsh
        env:
          FILECOMMANDER_QT_ROOT: ${{ env.QT_ROOT_DIR }}
          FILECOMMANDER_POPPLER_QT5_ROOT: ${{ github.workspace }}/build/poppler-qt5
        run: ./packaging/build-windows.ps1 -Profile windows-portable

      - uses: actions/upload-artifact@v4
        with:
          name: FileCommander-windows-x64-zip
          path: dist/FileCommander-*-windows-x64.zip

  full-preview-package:
    if: github.event_name == 'workflow_dispatch' && inputs.full_preview
    runs-on: [self-hosted, windows, filecommander-full-preview]
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and smoke-test the full portable package
        shell: pwsh
        run: |
          cmake -S . -B build/windows-full-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:FILECOMMANDER_QT_ROOT" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DTTC_BUILD_TESTS=ON -DTTC_BUILD_BENCH=OFF -DFILECOMMANDER_ENABLE_NETWORK=ON -DFILECOMMANDER_PREVIEW_PDF=ON -DFILECOMMANDER_PREVIEW_MEDIA=ON -DFILECOMMANDER_POPPLER_QT5_ROOT="$env:FILECOMMANDER_POPPLER_QT5_ROOT" -DFILECOMMANDER_MPV_ROOT="$env:FILECOMMANDER_MPV_ROOT"
          cmake --build build/windows-full-ci --parallel
          ctest --test-dir build/windows-full-ci --output-on-failure
          ./packaging/build-windows.ps1 -WithFullPreviews
      - uses: actions/upload-artifact@v4
        with:
          name: FileCommander-windows-x64
          path: dist/FileCommander-*-windows-x64.zip
