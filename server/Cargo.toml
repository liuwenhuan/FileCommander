[package]
name = "filecommander-account"
version = "0.1.0"
edition = "2021"
description = "FileCommander account, device registry and transfer signalling server"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
chrono = "0.4"
futures-util = "0.3"
hex = "0.4"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
